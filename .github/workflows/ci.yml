name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json is gitignored; bun.lock is committed but CI uses npm
      # to match local `npm run lint` / `npm test` gates.
      - name: Install dependencies
        run: npm install

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Unit tests
        run: npm test
